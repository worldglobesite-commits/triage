<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1">
  	<title>Входящие заявки</title>
  	<style>
		body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
		textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
		button { padding: .4rem .8rem; font: inherit; }
		h2 { margin: 0; }
		h3 { margin: 1rem 0 0; }
		#result { margin-top: 1rem; }
		#draft { margin: 0; white-space: pre-wrap; }
		.notice { padding: .5rem .75rem; border-left: 4px solid #c60; background: #fff4e5; }
  	</style>
</head>
<body>
  	<h1>Входящие заявки</h1>
  	<form>
		<label for="message">Текст заявки</label>
		<textarea id="message" rows="4"></textarea>
		<button type="submit">Разобрать заявку</button>
  	</form>
  	<div id="result" aria-live="polite">
		<p id="notice" class="notice" hidden></p>
		<section id="success" hidden>
	  		<h2>Тема</h2>
			<span id="topic"></span>
	  		<h3>Черновик ответа</h3>
	  		<p id="draft"></p>
		</section>
	</div>
  	<script type="module">
		const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
		const form = document.querySelector("form");
		const button = form.querySelector("button");
		const notice = document.querySelector("#notice");
		const success = document.querySelector("#success");
		const topic = document.querySelector("#topic");
		const draft = document.querySelector("#draft");

		function showNotice(message) {
			topic.textContent = "";
			draft.textContent = "";
			success.hidden = true;
			notice.textContent = message;
			notice.hidden = false;
		}

		function showResult(data) {
			notice.hidden = true;
			topic.textContent = TOPIC_LABELS[data.topic];
			draft.textContent = data.draft;
			success.hidden = false;
		}

		form.addEventListener("submit", async (event) => {
		event.preventDefault();
		button.disabled = true;
		try {
			const reply = await fetch("/api/triage", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ text: document.querySelector("#message").value }),
			});
			const data = await reply.json();

			if (data.status === "ready") showResult(data);
			else if (data.status === "manual_review") showNotice("Не удалось автоматически разобрать заявку. Обработайте её вручную.");
			else if (data.status === "invalid_input") showNotice("Введите текст заявки.");
			else showNotice("Ошибка сервера. Попробуйте ещё раз или обработайте заявку вручную.");
		} catch {
			showNotice("Не удалось связаться с сервером. Попробуйте ещё раз.");
		} finally {
			button.disabled = false;
		}
		});
  </script>
</body>
</html>
